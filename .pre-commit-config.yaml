# Every hook is `language: system`: the tools come from the environment rather
# than from pre-commit's own isolated installs. On NixOS that is the only thing
# that works for ruff (the published wheel is a prebuilt dynamically linked
# binary), and it keeps every hook on the same version as `just lint`.
# `nix-shell` provides all of them; see CONTRIBUTING.rst.
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types_or: [python, pyi]
        # pyright checks the whole `include` set from pyproject.toml: a change
        # in one file breaks type checking in another.
        pass_filenames: false

      - id: alejandra
        name: alejandra
        entry: alejandra --quiet
        language: system
        types: [nix]
        # Generated by `npins`; formatting it here would only be undone by the
        # next `npins update`.
        exclude: ^npins/

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
